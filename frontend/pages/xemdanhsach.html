<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách phòng | Amanoi Hotel</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <h2>Amanoi Hotel</h2>
        </div>

        <nav class="menu">
            <p class="menu-title">QUẢN LÝ PHÒNG</p>
            <a href="xemdanhsach.html" class="menu-item active">Xem danh sách phòng</a>
            <a href="../index.html" class="menu-item">Trang chủ</a>
        </nav>

        <button id="logoutBtn" class="logout-btn" type="button">Đăng xuất</button>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <p class="section-kicker">QUẢN LÝ</p>
                <h1>Danh sách phòng</h1>
            </div>
        </header>

        <section class="room-list-section">
            <div class="section-heading">
                <div>
                    <p class="section-kicker">TỔNG QUAN</p>
                    <h2>Phòng hiện tại</h2>
                </div>
            </div>

            <div class="room-legend" aria-label="Chú thích trạng thái phòng">
                <div class="legend-item"><span class="legend-color available"></span>Phòng trống</div>
                <div class="legend-item"><span class="legend-color occupied"></span>Đã có người thuê</div>
            </div>

            <div id="roomListGrid" class="room-list-grid" aria-live="polite"></div>
        </section>
    </main>

    <script src="../js/xemdanhsach.js"></script>
    <script src="../js/logout.js"></script>
</body>
</html>
