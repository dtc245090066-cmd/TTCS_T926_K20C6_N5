<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#171717">
	<title>Đăng nhập | Amanoi Hotel</title>
	<link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page">
	<main class="login-shell">
		<section class="login-aside" aria-label="Amanoi Hotel">
			<a class="login-brand" href="../index.html">Amanoi <span>Hotel</span></a>
			<div class="login-aside-copy">
				<p class="login-eyebrow">QUẢN LÝ KHÁCH SẠN</p>
				<h1>Chào mừng<br>trở lại.</h1>
				<p>Không gian quản lý vận hành dành riêng cho đội ngũ Amanoi.</p>
			</div>
			<span class="login-aside-foot">AMANOl HOTEL · MANAGEMENT</span>
		</section>

		<section class="login-panel" aria-labelledby="loginTitle">
			<div class="login-form-wrap">
				<p class="login-eyebrow">TÀI KHOẢN NHÂN VIÊN</p>
				<h2 id="loginTitle">Đăng nhập</h2>
				<p class="login-intro">Nhập thông tin tài khoản để tiếp tục.</p>

				<form id="loginForm" class="login-form">
					<label for="username">Tên đăng nhập</label>
					<input id="username" name="username" type="text" autocomplete="username"
						placeholder="Nhập tên đăng nhập" required autofocus>

					<label for="password">Mật khẩu</label>
					<input id="password" name="password" type="password" autocomplete="current-password"
						placeholder="Nhập mật khẩu" required>

					<p id="loginMessage" class="login-message" role="alert" aria-live="polite"></p>
					<button id="loginSubmit" class="login-submit" type="submit">
						<span>Đăng nhập</span><span aria-hidden="true">→</span>
					</button>
				</form>
				<p class="login-security">Phiên đăng nhập được bảo vệ và tự hết hạn sau 8 giờ.</p>
			</div>
		</section>
	</main>
	<script src="../js/login.js"></script>
</body>
</html>
